# Markdown lint configuration for RLP spec
# Relaxed rules that work with protocol specification style

# Allow long lines (spec text is often dense)
MD013: false

# Allow HTML in markdown (used for examples)
MD033: false

# Allow duplicate headings (common in specs with repeated section patterns)
MD024:
  siblings_only: true

# Allow trailing punctuation in headings
MD026: false

# Allow inline HTML
MD036: false

# Allow code blocks without blank lines around them (common in spec list items)
MD031: false

# Allow lists without blank lines around them
MD032: false

# Allow fenced code blocks without language specified
MD040: false

# Allow compact table style (no spaces around pipes)
MD060: false

# Allow files to start with non-h1 heading (PR template starts with ##)
MD041: false

# Allow multiple top-level headings
MD025: false

# Allow bare URLs
MD034: false

# Allow headings without blank lines below (checklist style)
MD022: false
